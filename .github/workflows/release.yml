name: Extensión de Claude Desktop

# Al publicar un release, arma unimcp-<versión>.mcpb y lo adjunta para que se baje desde la página del
# release, junto con una copia como unimcp.mcpb para el link directo al último. Las credenciales llegan a la extensión por variables de entorno, así que da igual que se arme
# en Linux: el binario del keychain no hace falta.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  mcpb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mcpb
      # Also as unimcp.mcpb: a fixed name keeps releases/latest/download/unimcp.mcpb (the site and README) working
      - run: cp unimcp-*.mcpb unimcp.mcpb
      - run: gh release upload "${{ github.event.release.tag_name }}" unimcp-*.mcpb unimcp.mcpb --clobber
        env:
          GH_TOKEN: ${{ github.token }}
