name: Registro de MCP

# Al publicar un release, sube server.json al registro oficial de MCP (registry.modelcontextprotocol.io).
# El registro verifica el paquete de npm por su `mcpName`, así que antes hay que correr `npm publish`: el
# job espera a que la versión aparezca en npm. Entra con el OIDC de GitHub, sin secretos guardados.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # Versión fija de mcp-publisher y el sha256 de su linux_amd64.tar.gz, para no correr lo que se suba después.
  PUBLISHER_VERSION: v1.8.1
  PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Esperar la versión en npm
        run: |
          version=$(jq -r .version package.json)
          for i in $(seq 1 30); do
            npm view "@nuwujix/unimcp@$version" version && exit 0
            sleep 20
          done
          echo "@nuwujix/unimcp@$version no está en npm: corré npm publish y volvé a lanzar este workflow." >&2
          exit 1
      - name: Instalar mcp-publisher
        run: |
          curl -sSfL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
