name: Web

# La web (site/) lee los campus y las tools de src/, así que se rearma cuando cambian ellos también.
# En un PR solo se arma, para que un cambio en el servidor no la rompa sin enterarnos; en master se publica.
on:
  push:
    branches: [master]
    paths: [site/**, src/**, package.json, package-lock.json, .github/workflows/site.yml]
  pull_request:
    paths: [site/**, src/**, package.json, package-lock.json, .github/workflows/site.yml]
  workflow_dispatch:

permissions:
  contents: read

# Una publicación a la vez; la que está en curso termina antes de que arranque la siguiente.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Astro 7 pide Node 22.23 o más nuevo.
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      # Las dependencias del servidor hacen falta para leer sus campus y sus tools (scripts/data.mts).
      - run: npm ci
      - run: npm ci
        working-directory: site
      - run: npm run check
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          # Para la lista de colaboradores (API de GitHub) sin el límite de pedidos anónimos.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # Solo este job publica: escribe en Pages y prueba su identidad con OIDC.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
